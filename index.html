<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="Time. Screen clocks, a series.">
<meta name="referrer" content="no-referrer">
<title>Time. Screen clocks</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <section id="index" class="view" aria-label="All clocks">
    <header class="ix-head">
      <div class="ix-mark">Time.</div>
      <div class="ix-sub">Screen clocks<br><span class="dim">Series 01</span></div>
    </header>
    <nav id="grid" class="grid"></nav>
    <footer class="ix-foot dim">
      <span>Swipe or ← → to switch</span><span>Tap for fullscreen</span><span>Back returns here</span>
    </footer>
  </section>

  <section id="clock" class="view" hidden aria-live="off">
    <div id="stage" class="stage"></div>
    <div id="chrome" class="chrome">
      <a href="#/" id="back" class="c-btn" aria-label="All clocks">←&nbsp;All</a>
      <div id="c-title" class="c-title"></div>
      <div class="c-right">
        <span id="c-count" class="dim"></span>
        <button id="fs" class="c-btn" aria-label="Fullscreen">⤢</button>
      </div>
    </div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
